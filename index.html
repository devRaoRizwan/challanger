<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSA Momentum</title>
    <meta
      name="description"
      content="A simple DSA tracker built around baby steps, pattern learning, and sustainable momentum."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <p class="eyebrow">Study plan</p>
          <h1>DSA Momentum</h1>
        </div>
        <div id="chapter-list" class="chapter-list" aria-label="DSA chapters"></div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow muted">Pattern-based learning</p>
            <h2 id="chapter-title">Loading…</h2>
          </div>
          <div id="progress-pill" class="progress-pill">0 / 0</div>
        </header>

        <section id="focus-card" class="focus-card"></section>
        <section id="task-list" class="task-list" aria-live="polite"></section>
      </main>
    </div>

    <script src="plan.js"></script>
    <script src="app.js"></script>
  </body>
</html>
